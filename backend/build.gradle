plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.alanstoll'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-restclient'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.flywaydb:flyway-database-postgresql'
	developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-jdbc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

def composeFile = file('../compose.yaml')
def dataDir = file('../data')
def gdalImage = 'ghcr.io/osgeo/gdal:alpine-normal-3.13.1'

def runCommand = { List<String> command ->
	def process = new ProcessBuilder(command as String[]).redirectErrorStream(true).start()
	def output = process.inputStream.getText('UTF-8')
	if (process.waitFor() != 0) {
		throw new GradleException("${command.take(4).join(' ')} failed: ${output}")
	}
	output.trim()
}

def compose = { List<String> arguments ->
	runCommand(['docker', 'compose', '-f', composeFile.absolutePath] + arguments)
}

// All services, not just postgis: Boot skips its own compose startup once anything is running,
// and would then never start geoserver.
def startStack = {
	compose(['up', '-d', '--wait'])
}

def psql = { String sql ->
	compose(['exec', '-T', 'postgis', 'psql', '-U', 'app', '-d', 'sandysprings', '-qtAX', '-c', sql])
}

def fingerprint = { File source ->
	source.length() > 64 * 1024 * 1024
			? "size=${source.length()};mtime=${source.lastModified()}".toString()
			: java.security.MessageDigest.getInstance('SHA-256').digest(source.bytes).encodeHex().toString()
}

tasks.register('ingestData') {
	group = 'gis'
	description = 'Loads the sources listed in data/layers.json into the staging schema with ogr2ogr'
	doLast {
		startStack()
		// staging is owned here, not by Flyway: keeping it out of spring.flyway.schemas is what lets
		// resetSchema rebuild app and gis without re-ingesting
		psql('''create schema if not exists staging;
				create table if not exists staging.load_log (
					layer       text primary key,
					source      text not null,
					fingerprint text not null,
					ingested_at timestamptz not null default now());''')
		def network = null
		new groovy.json.JsonSlurper().parse(new File(dataDir, 'layers.json')).each { layer ->
			def source = new File(dataDir, layer.source)
			if (!source.isFile()) {
				throw new GradleException("${layer.layer}: no source at ${source}")
			}
			def current = fingerprint(source)
			if (psql("select fingerprint from staging.load_log where layer = '${layer.layer}'") == current) {
				logger.lifecycle("ingestData: staging.${layer.table} is up to date")
				return
			}
			network = network ?: new groovy.json.JsonSlurper()
					.parseText(compose(['config', '--format', 'json'])).name + '_default'
			def report = runCommand(['docker', 'run', '--rm', '--network', network,
					'-v', "${dataDir.absolutePath.replace(File.separatorChar, '/' as char)}:/data:ro", gdalImage,
					'ogr2ogr', '-f', 'PostgreSQL',
					'PG:host=postgis dbname=sandysprings user=app password=app',
					"/data/${layer.source}", '-nln', "staging.${layer.table}", '-overwrite',
					'-lco', 'GEOMETRY_NAME=geom', '-lco', 'FID=id'] + layer.options)
			if (report) {
				logger.lifecycle(report)
			}
			psql("""insert into staging.load_log (layer, source, fingerprint)
					values ('${layer.layer}', '${layer.source}', '${current}')
					on conflict (layer) do update set source = excluded.source,
						fingerprint = excluded.fingerprint, ingested_at = now();""")
			logger.lifecycle("ingestData: staging.${layer.table} loaded from ${layer.source}")
		}
	}
}


// Everything cut to the map's extent uses these: the basemap archive, the flood zone clip, and
// maxBounds in the frontend. City limits plus a 2 km buffer.
def mapBounds = ['-84.47060', '33.85860', '-84.23737', '34.02844']

// Basemap vector tiles. Planetiler writes a pmtiles archive that the frontend serves as a static
// file over HTTP range requests, so there is no tile server. Not wired into bootRun: the build is
// slow, its sources are large, and neither the backend nor the gis schema depends on it.
def planetilerVersion = '0.10.2'
def planetilerJar = new File(dataDir, 'raw/planetiler.jar')
def basemapOutput = file('../frontend/public/basemap.pmtiles')
def basemapMaxzoom = 16  // planetiler's maximum

tasks.register('buildBasemap') {
	group = 'gis'
	description = 'Builds the OpenStreetMap basemap pmtiles archive with planetiler'
	inputs.property('planetiler', planetilerVersion)
	inputs.property('bounds', mapBounds)
	inputs.property('maxzoom', basemapMaxzoom)
	outputs.file(basemapOutput)
	doLast {
		if (!planetilerJar.isFile()) {
			logger.lifecycle("buildBasemap: downloading planetiler ${planetilerVersion}")
			planetilerJar.parentFile.mkdirs()
			URI.create("https://github.com/onthegomap/planetiler/releases/download/v${planetilerVersion}/planetiler.jar")
					.toURL().withInputStream { source -> planetilerJar.withOutputStream { it << source } }
		}
		basemapOutput.parentFile.mkdirs()
		// Stream the log line by line rather than buffering it like runCommand (this runs for
		// minutes), and rather than inheritIO: under the Gradle daemon that hands the child a pipe
		// nobody drains, and planetiler blocks as soon as it fills.
		def process = new ProcessBuilder(['java', '-Xmx4g', '-jar', planetilerJar.absolutePath,
				// area only names the cached download; osm_url is what actually gets fetched
				'--area=georgia',
				'--osm_url=https://download.geofabrik.de/north-america/us/georgia-latest.osm.pbf',
				'--download',
				"--download_dir=${new File(dataDir, 'raw/planetiler/sources').absolutePath}",
				"--tmpdir=${new File(dataDir, 'raw/planetiler/tmp').absolutePath}",
				"--bounds=${mapBounds.join(',')}",
				'--minzoom=0', "--maxzoom=${basemapMaxzoom}",
				"--output=${basemapOutput.absolutePath}",
				'--force'] as String[]).redirectErrorStream(true).start()
		process.inputStream.withReader('UTF-8') { reader -> reader.eachLine { logger.lifecycle(it) } }
		if (process.waitFor() != 0) {
			throw new GradleException("planetiler failed with exit ${process.exitValue()}")
		}
		logger.lifecycle("buildBasemap: wrote ${basemapOutput.name} (${(basemapOutput.length() / 1048576) as int} MB)")
	}
}
// FEMA publishes the National Flood Hazard Layer one county at a time, and the Fulton County
// download is far too large to commit. This cuts it down to a load-ready source that is, so
// data/layers/flood-hazard.geojson is what a fresh clone ingests. Re-run it when FEMA reissues
// the county. Not wired into bootRun for the same reason as buildBasemap: its input is not there.
tasks.register('prepareFloodHazard') {
	group = 'gis'
	description = 'Clips the FEMA NFHL download in data/raw/nfhl to the map bounds, writing data/layers/flood-hazard.geojson'
	doLast {
		def source = new File(dataDir, 'raw/nfhl/S_FLD_HAZ_AR.shp')
		if (!source.isFile()) {
			throw new GradleException("no NFHL county download at ${source.parentFile}")
		}
		def output = new File(dataDir, 'layers/flood-hazard.geojson')
		output.delete()
		runCommand(['docker', 'run', '--rm',
				'-v', "${dataDir.absolutePath.replace(File.separatorChar, '/' as char)}:/data", gdalImage,
				'ogr2ogr', '-f', 'GeoJSON', '/data/layers/flood-hazard.geojson',
				'/data/raw/nfhl/S_FLD_HAZ_AR.shp', '-clipsrc'] + mapBounds +
				// the rest of the NFHL schema is -9999 or a study id everywhere in this extent
				['-select', 'FLD_ZONE,ZONE_SUBTY,SFHA_TF', '-nlt', 'PROMOTE_TO_MULTI',
				'-lco', 'RFC7946=YES', '-lco', 'COORDINATE_PRECISION=6'])
		logger.lifecycle("prepareFloodHazard: wrote ${output.name} (${(output.length() / 1048576) as int} MB)")
	}
}

// The American Community Survey is tabular, so an ACS layer takes two committed sources per
// geography: polygons from TIGER/Line, and the estimates keyed to them by GEOID. Keeping them apart
// is what makes adding a table later a column in the csv rather than a re-clip of the geometry.
//
// Two geographies rather than one because the survey's reliability and the map's resolution pull
// against each other, and where the line falls depends on the theme. A count taken over the whole
// population still holds up at block group; a share of some subset of it does not, because the
// subset in one block group is a handful of households. Measured over this extent, share-of-subset
// themes are usable in barely half the block groups and nine tenths of the tracts, so those live on
// tracts and the rest keep the finer geography. Census requires an API key now, but only to refresh:
// the committed csv is what a fresh clone ingests.
def acsYear = 2024
def acsState = '13'  // Georgia

def acsVariables = { String table, List<String> numbers ->
	numbers.collectMany { ["${table}_${it}E".toString(), "${table}_${it}M".toString()] }
}

def acsGeographies = [
	[name: 'bg', tiger: 'BG', file: 'bg', keys: ['state', 'county', 'tract', 'block group'],
	 // a block group query has to spell out every level above it; in=county:* alone is a 400
	 predicate: "for=block%20group:*&in=state:${acsState}&in=county:*&in=tract:*",
	 variables:
			 // B03002 Hispanic or Latino Origin by Race: eight mutually exclusive categories
			 acsVariables('B03002', ['001', '003', '004', '005', '006', '007', '008', '009', '012']) +
			 // B01001 Sex by Age, summed into under 18 and 65-and-over on the way into gis
			 acsVariables('B01001', ['001', '003', '004', '005', '006', '027', '028', '029', '030',
									 '020', '021', '022', '023', '024', '025',
									 '044', '045', '046', '047', '048', '049']) +
			 // B25044 Tenure by Vehicles Available, owner and renter with no vehicle
			 acsVariables('B25044', ['001', '003', '010'])],
	[name: 'tract', tiger: 'TRACT', file: 'tract', keys: ['state', 'county', 'tract'],
	 predicate: "for=tract:*&in=state:${acsState}&in=county:*",
	 variables:
			 acsVariables('B19013', ['001']) +   // median household income
			 acsVariables('B25077', ['001']) +   // median home value
			 acsVariables('B25064', ['001']) +   // median gross rent
			 acsVariables('B25003', ['001', '003']) +  // tenure, total and renter-occupied
			 // B08301 Means of Transportation to Work. These nine leaves are exclusive and sum to
			 // the total, so every commuter lands in exactly one; the intermediate car and transit
			 // subtotals are left out because they would double-count.
			 acsVariables('B08301', ['001', '003', '004', '010', '016', '017', '018', '019', '020', '021'])],
]

tasks.register('prepareAcs') {
	group = 'gis'
	description = "Clips TIGER geographies to the map bounds and fetches ACS ${acsYear} 5-year estimates into data/layers/acs-*.{geojson,csv}"
	doLast {
		def key = System.getenv('CENSUS_API_KEY')
		if (!key) {
			throw new GradleException('CENSUS_API_KEY is not set; request one at https://api.census.gov/data/key_signup.html')
		}
		acsGeographies.each { geography ->
			def zip = new File(dataDir, "raw/tiger/tl_${acsYear}_${acsState}_${geography.file}.zip")
			if (!zip.isFile()) {
				logger.lifecycle("prepareAcs: downloading ${zip.name}")
				zip.parentFile.mkdirs()
				URI.create("https://www2.census.gov/geo/tiger/TIGER${acsYear}/${geography.tiger}/${zip.name}")
						.toURL().withInputStream { source -> zip.withOutputStream { it << source } }
			}
			def geometry = new File(dataDir, "layers/acs-${geography.name}.geojson")
			geometry.delete()
			runCommand(['docker', 'run', '--rm',
					'-v', "${dataDir.absolutePath.replace(File.separatorChar, '/' as char)}:/data", gdalImage,
					'ogr2ogr', '-f', 'GeoJSON', "/data/layers/acs-${geography.name}.geojson",
					"/vsizip//data/raw/tiger/${zip.name}", '-clipsrc'] + mapBounds +
					// GEOID is the join key; the rest of the TIGER schema is land area and centroids
					['-select', 'GEOID', '-nlt', 'PROMOTE_TO_MULTI', '-t_srs', 'EPSG:4326',
					'-lco', 'RFC7946=YES', '-lco', 'COORDINATE_PRECISION=6'])

			def wanted = new groovy.json.JsonSlurper().parse(geometry).features
					.collect { it.properties.GEOID } as Set
			// The api caps a request at 50 variables, and asking for the state rather than a county
			// list keeps the counties the extent happens to touch out of the build, so widening
			// mapBounds cannot silently drop one.
			def estimates = [:].withDefault { [:] }
			geography.variables.collate(45).each { chunk ->
				def url = "https://api.census.gov/data/${acsYear}/acs/acs5?get=${chunk.join(',')}" +
						"&${geography.predicate}&key=${key}"
				def response
				try {
					response = new groovy.json.JsonSlurper().parseText(URI.create(url).toURL().getText('UTF-8'))
				}
				catch (IOException e) {
					// the url carries the api key, so it must never reach the build log
					throw new GradleException("ACS request failed: ${e.message.replace(key, '***')}")
				}
				def header = response.head()
				response.tail().each { row ->
					def geoid = geography.keys.collect { row[header.indexOf(it)] }.join('')
					if (wanted.contains(geoid)) {
						chunk.each { estimates[geoid][it] = row[header.indexOf(it)] }
					}
				}
			}
			if (estimates.size() != wanted.size()) {
				throw new GradleException("ACS covered ${estimates.size()} of the ${wanted.size()} ${geography.name} in the clip")
			}
			new File(dataDir, "layers/acs-${geography.name}.csv").withWriter('UTF-8') { writer ->
				writer.writeLine((['GEOID'] + geography.variables).join(','))
				estimates.keySet().sort().each { geoid ->
					writer.writeLine(([geoid] + geography.variables.collect { estimates[geoid][it] ?: '' }).join(','))
				}
			}
			logger.lifecycle("prepareAcs: wrote acs-${geography.name}.geojson and .csv " +
					"(${estimates.size()} features, ${geography.variables.size()} variables)")
		}
	}
}

tasks.register('resetSchema') {
	group = 'gis'
	description = 'Drops the app and gis schemas so the next bootRun re-migrates; keeps staging'
	doLast {
		startStack()
		psql('drop schema if exists gis cascade; drop schema if exists app cascade;')
		logger.lifecycle('resetSchema: dropped app and gis, kept staging')
	}
}

tasks.named('bootRun') {
	dependsOn 'ingestData'
}
