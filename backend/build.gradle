plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.alanstoll'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-restclient'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.flywaydb:flyway-database-postgresql'
	developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-jdbc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

def composeFile = file('../compose.yaml')
def dataDir = file('../data')
def gdalImage = 'ghcr.io/osgeo/gdal:alpine-normal-3.13.1'

def runCommand = { List<String> command ->
	def process = new ProcessBuilder(command as String[]).redirectErrorStream(true).start()
	def output = process.inputStream.getText('UTF-8')
	if (process.waitFor() != 0) {
		throw new GradleException("${command.take(4).join(' ')} failed: ${output}")
	}
	output.trim()
}

def compose = { List<String> arguments ->
	runCommand(['docker', 'compose', '-f', composeFile.absolutePath] + arguments)
}

// All services, not just postgis: Boot skips its own compose startup once anything is running,
// and would then never start geoserver.
def startStack = {
	compose(['up', '-d', '--wait'])
}

def psql = { String sql ->
	compose(['exec', '-T', 'postgis', 'psql', '-U', 'app', '-d', 'sandysprings', '-qtAX', '-c', sql])
}

def fingerprint = { File source ->
	source.length() > 64 * 1024 * 1024
			? "size=${source.length()};mtime=${source.lastModified()}".toString()
			: java.security.MessageDigest.getInstance('SHA-256').digest(source.bytes).encodeHex().toString()
}

tasks.register('ingestData') {
	group = 'gis'
	description = 'Loads the sources listed in data/layers.json into the staging schema with ogr2ogr'
	doLast {
		startStack()
		// staging is owned here, not by Flyway: keeping it out of spring.flyway.schemas is what lets
		// resetSchema rebuild app and gis without re-ingesting
		psql('''create schema if not exists staging;
				create table if not exists staging.load_log (
					layer       text primary key,
					source      text not null,
					fingerprint text not null,
					ingested_at timestamptz not null default now());''')
		def network = null
		new groovy.json.JsonSlurper().parse(new File(dataDir, 'layers.json')).each { layer ->
			def source = new File(dataDir, layer.source)
			if (!source.isFile()) {
				throw new GradleException("${layer.layer}: no source at ${source}")
			}
			def current = fingerprint(source)
			if (psql("select fingerprint from staging.load_log where layer = '${layer.layer}'") == current) {
				logger.lifecycle("ingestData: staging.${layer.table} is up to date")
				return
			}
			network = network ?: new groovy.json.JsonSlurper()
					.parseText(compose(['config', '--format', 'json'])).name + '_default'
			def report = runCommand(['docker', 'run', '--rm', '--network', network,
					'-v', "${dataDir.absolutePath.replace(File.separatorChar, '/' as char)}:/data:ro", gdalImage,
					'ogr2ogr', '-f', 'PostgreSQL',
					'PG:host=postgis dbname=sandysprings user=app password=app',
					"/data/${layer.source}", '-nln', "staging.${layer.table}", '-overwrite',
					'-lco', 'GEOMETRY_NAME=geom', '-lco', 'FID=id'] + layer.options)
			if (report) {
				logger.lifecycle(report)
			}
			psql("""insert into staging.load_log (layer, source, fingerprint)
					values ('${layer.layer}', '${layer.source}', '${current}')
					on conflict (layer) do update set source = excluded.source,
						fingerprint = excluded.fingerprint, ingested_at = now();""")
			logger.lifecycle("ingestData: staging.${layer.table} loaded from ${layer.source}")
		}
	}
}


// Everything cut to the map's extent uses these: the basemap archive, the flood zone clip, and
// maxBounds in the frontend. City limits plus a 2 km buffer.
def mapBounds = ['-84.47060', '33.85860', '-84.23737', '34.02844']

// Basemap vector tiles. Planetiler writes a pmtiles archive that the frontend serves as a static
// file over HTTP range requests, so there is no tile server. Not wired into bootRun: the build is
// slow, its sources are large, and neither the backend nor the gis schema depends on it.
def planetilerVersion = '0.10.2'
def planetilerJar = new File(dataDir, 'raw/planetiler.jar')
def basemapOutput = file('../frontend/public/basemap.pmtiles')
def basemapMaxzoom = 16  // planetiler's maximum

tasks.register('buildBasemap') {
	group = 'gis'
	description = 'Builds the OpenStreetMap basemap pmtiles archive with planetiler'
	inputs.property('planetiler', planetilerVersion)
	inputs.property('bounds', mapBounds)
	inputs.property('maxzoom', basemapMaxzoom)
	outputs.file(basemapOutput)
	doLast {
		if (!planetilerJar.isFile()) {
			logger.lifecycle("buildBasemap: downloading planetiler ${planetilerVersion}")
			planetilerJar.parentFile.mkdirs()
			URI.create("https://github.com/onthegomap/planetiler/releases/download/v${planetilerVersion}/planetiler.jar")
					.toURL().withInputStream { source -> planetilerJar.withOutputStream { it << source } }
		}
		basemapOutput.parentFile.mkdirs()
		// Stream the log line by line rather than buffering it like runCommand (this runs for
		// minutes), and rather than inheritIO: under the Gradle daemon that hands the child a pipe
		// nobody drains, and planetiler blocks as soon as it fills.
		def process = new ProcessBuilder(['java', '-Xmx4g', '-jar', planetilerJar.absolutePath,
				// area only names the cached download; osm_url is what actually gets fetched
				'--area=georgia',
				'--osm_url=https://download.geofabrik.de/north-america/us/georgia-latest.osm.pbf',
				'--download',
				"--download_dir=${new File(dataDir, 'raw/planetiler/sources').absolutePath}",
				"--tmpdir=${new File(dataDir, 'raw/planetiler/tmp').absolutePath}",
				"--bounds=${mapBounds.join(',')}",
				'--minzoom=0', "--maxzoom=${basemapMaxzoom}",
				"--output=${basemapOutput.absolutePath}",
				'--force'] as String[]).redirectErrorStream(true).start()
		process.inputStream.withReader('UTF-8') { reader -> reader.eachLine { logger.lifecycle(it) } }
		if (process.waitFor() != 0) {
			throw new GradleException("planetiler failed with exit ${process.exitValue()}")
		}
		logger.lifecycle("buildBasemap: wrote ${basemapOutput.name} (${(basemapOutput.length() / 1048576) as int} MB)")
	}
}
// FEMA publishes the National Flood Hazard Layer one county at a time, and the Fulton County
// download is far too large to commit. This cuts it down to a load-ready source that is, so
// data/layers/flood-hazard.geojson is what a fresh clone ingests. Re-run it when FEMA reissues
// the county. Not wired into bootRun for the same reason as buildBasemap: its input is not there.
tasks.register('prepareFloodHazard') {
	group = 'gis'
	description = 'Clips the FEMA NFHL download in data/raw/nfhl to the map bounds, writing data/layers/flood-hazard.geojson'
	doLast {
		def source = new File(dataDir, 'raw/nfhl/S_FLD_HAZ_AR.shp')
		if (!source.isFile()) {
			throw new GradleException("no NFHL county download at ${source.parentFile}")
		}
		def output = new File(dataDir, 'layers/flood-hazard.geojson')
		output.delete()
		runCommand(['docker', 'run', '--rm',
				'-v', "${dataDir.absolutePath.replace(File.separatorChar, '/' as char)}:/data", gdalImage,
				'ogr2ogr', '-f', 'GeoJSON', '/data/layers/flood-hazard.geojson',
				'/data/raw/nfhl/S_FLD_HAZ_AR.shp', '-clipsrc'] + mapBounds +
				// the rest of the NFHL schema is -9999 or a study id everywhere in this extent
				['-select', 'FLD_ZONE,ZONE_SUBTY,SFHA_TF', '-nlt', 'PROMOTE_TO_MULTI',
				'-lco', 'RFC7946=YES', '-lco', 'COORDINATE_PRECISION=6'])
		logger.lifecycle("prepareFloodHazard: wrote ${output.name} (${(output.length() / 1048576) as int} MB)")
	}
}

// Fulton County publishes the whole county roll: 373k parcels, 418 MB, far too large to commit and
// 92% of it outside the city. This cuts it to a load-ready source, so data/layers/tax-parcel.geojson
// is what a fresh clone ingests. Re-run it when Fulton reissues the roll. Not wired into bootRun for
// the same reason as buildBasemap: its input is not there.
//
// Selection is by the assessor's own tax district rather than -clipsrc against city-limit.geojson.
// Parcels are legal boundaries, so cutting one at a polygon edge produces a lie plus a sliver; that
// clip also emitted a LineString and a GeometryCollection that would fail the MultiPolygon load. And
// the polygon is a 2005 vintage that disagrees with the 2026 roll on some 400 parcels, swallowing
// Atlanta's Chastain Park while dropping Sandy Springs ones. 59 is the city; 59B is the same city
// with the Perimeter CID levy on top, so both belong.
tasks.register('prepareTaxParcels') {
	group = 'gis'
	description = 'Selects the Sandy Springs tax districts from the Fulton County parcel roll in data/raw/taxparcels, writing data/layers/tax-parcel.geojson'
	doLast {
		def source = new File(dataDir, 'raw/taxparcels/Tax_Parcels.geojson')
		if (!source.isFile()) {
			throw new GradleException("no Fulton County parcel roll at ${source}")
		}
		def output = new File(dataDir, 'layers/tax-parcel.geojson')
		output.delete()
		runCommand(['docker', 'run', '--rm',
				'-v', "${dataDir.absolutePath.replace(File.separatorChar, '/' as char)}:/data", gdalImage,
				'ogr2ogr', '-f', 'GeoJSON', '/data/layers/tax-parcel.geojson',
				'/data/raw/taxparcels/Tax_Parcels.geojson',
				'-where', "TaxDist IN ('59', '59B')",
				// Owner and OwnerAddr1/2 name a resident at two thirds of these addresses, and ExCode's
				// senior suffixes would publish the owner's age bracket next to it. The rest is
				// redundant: FeatureID repeats ParcelID, TaxYear is 2026 throughout, Shape__Area is
				// LandAcres in square feet, the Addr* parts spell out Address, and TaxDist is constant
				// once the -where has run.
				'-select', 'ParcelID,Address,LUCode,ClassCode,LandAcres,LivUnits',
				'-nlt', 'PROMOTE_TO_MULTI',
				// 7 decimals, where every other layer takes 6: rounding to 6 collapses a spike on
				// 17 0034  LL1698 into a two-point LineString, and ogr2ogr then emits the parcel as a
				// GeometryCollection that no MultiPolygon column will take. Costs 0.3 MB
				'-lco', 'RFC7946=YES', '-lco', 'COORDINATE_PRECISION=7'])
		logger.lifecycle("prepareTaxParcels: wrote ${output.name} (${(output.length() / 1048576) as int} MB)")
	}
}

// The USGS National Geologic Map's Earth Surface synthesis, an ArcGIS feature service in the GeMS
// schema, far too large to commit. This pulls what intersects the map bounds and clips it: the
// map units, their contacts and faults, and the two description tables the units join at
// transform time, the way the ACS estimates join their geographies. The second table describes
// the units of the source map the synthesis was compiled from, which here is the 1976 Geologic
// map of Georgia and carries far more distinctions than the synthesis keeps. Not wired into
// bootRun: it is a download.
//
// Only Earth Surface: the service also publishes Quaternary, Pre-Quaternary and Precambrian
// syntheses, but inside these bounds the last two are identical to this one to the metre and the
// first is a single undifferentiated unit.
tasks.register('prepareGeology') {
	group = 'gis'
	description = 'Clips the USGS National Geologic Map Earth Surface service to the map bounds, writing data/layers/geology-{unit,line}.geojson and geology-{dmu,source-dmu}.csv'
	doLast {
		def service = 'https://services.arcgis.com/v01gqwM5QqNysAAi/arcgis/rest/services/National_Earth_Surface_v2/FeatureServer'
		def envelope = "geometry=${mapBounds.join(',')}&geometryType=esriGeometryEnvelope&inSR=4326" +
				'&spatialRel=esriSpatialRelIntersects&outSR=4326&'
		def query = { int layer, String params ->
			"'ESRIJSON:${service}/${layer}/query?${params.startsWith('where=') ? '' : 'where=1%3D1&'}${params}outFields=*&f=json' -oo FEATURE_SERVER_PAGING=YES"
		}
		def clip = "-clipsrc ${mapBounds.join(' ')} -nlt PROMOTE_TO_MULTI -lco RFC7946=YES -lco COORDINATE_PRECISION=6"
		def outputs = ['geology-unit.geojson', 'geology-line.geojson', 'geology-dmu.csv', 'geology-source-dmu.csv']
		outputs.each { new File(dataDir, "layers/${it}").delete() }
		def commands = [
				"ogr2ogr -f GeoJSON /data/layers/geology-unit.geojson ${query(6, envelope)} ${clip}" +
						' -dialect SQLite -sql "select MapUnit as map_unit, IdentityConfidence as identity_confidence,' +
						' MapSourceID as source_map, Source_MapUnit as source_unit, geometry from ESRIJSON"',
				"ogr2ogr -f GeoJSON /data/layers/geology-line.geojson ${query(3, envelope)} ${clip}" +
						' -dialect SQLite -sql "select Type as type, IsConcealed as concealed, Symbol as symbol, geometry from ESRIJSON"',
				// headings in the description tables have no unit and describe nothing on the map
				"ogr2ogr -f CSV /data/layers/geology-dmu.csv ${query(8, '')}" +
						' -dialect SQLite -sql "select MapUnit as map_unit, Name as name, Age as age, Description as description,' +
						' GeoMaterial as geomaterial, HierarchyKey as hierarchy from ESRIJSON where MapUnit is not null"',
				// only the one source map inside these bounds (the unit file's source_map column says
				// which): the table describes every source map in the country, 7,500 rows
				"ogr2ogr -f CSV /data/layers/geology-source-dmu.csv ${query(11, 'where=Source_MapUnit+LIKE+%2752%7C%25%27&')}" +
						' -dialect SQLite -sql "select Source_MapUnit as source_unit, Name as name, Age as age, Description as description,' +
						' GeoMaterial as geomaterial from ESRIJSON where Source_MapUnit is not null"',
		]
		// a script file rather than sh -c: the commands quote urls and sql, and ProcessBuilder on
		// Windows does not escape quotes inside an argument
		def script = layout.buildDirectory.file('prepare-geology.sh').get().asFile
		script.parentFile.mkdirs()
		script.text = (['set -e'] + commands).join('\n') + '\n'
		runCommand(['docker', 'run', '--rm',
				'-v', "${dataDir.absolutePath.replace(File.separatorChar, '/' as char)}:/data",
				'-v', "${script.absolutePath.replace(File.separatorChar, '/' as char)}:/prepare.sh:ro", gdalImage,
				'sh', '/prepare.sh'])
		outputs.each { logger.lifecycle("prepareGeology: wrote ${it} (${(new File(dataDir, "layers/${it}").length() / 1024) as int} KB)") }
	}
}

// The American Community Survey is tabular, so an ACS layer takes two committed sources per
// geography: polygons from TIGER/Line, and the estimates keyed to them by GEOID. Keeping them apart
// is what makes adding a table later a column in the csv rather than a re-clip of the geometry.
//
// Two geographies rather than one because the survey's reliability and the map's resolution pull
// against each other, and where the line falls depends on the theme. A count taken over the whole
// population still holds up at block group; a share of some subset of it does not, because the
// subset in one block group is a handful of households. Measured over this extent, share-of-subset
// themes are usable in barely half the block groups and nine tenths of the tracts, so those live on
// tracts and the rest keep the finer geography. Census requires an API key now, but only to refresh:
// the committed csv is what a fresh clone ingests.
def acsYear = 2024
def acsState = '13'  // Georgia

def acsVariables = { String table, List<String> numbers ->
	numbers.collectMany { ["${table}_${it}E".toString(), "${table}_${it}M".toString()] }
}

def acsGeographies = [
	[name: 'bg', tiger: 'BG', file: 'bg', keys: ['state', 'county', 'tract', 'block group'],
	 // a block group query has to spell out every level above it; in=county:* alone is a 400
	 predicate: "for=block%20group:*&in=state:${acsState}&in=county:*&in=tract:*",
	 variables:
			 // B03002 Hispanic or Latino Origin by Race: eight mutually exclusive categories
			 acsVariables('B03002', ['001', '003', '004', '005', '006', '007', '008', '009', '012']) +
			 // B01001 Sex by Age, summed into under 18 and 65-and-over on the way into gis
			 acsVariables('B01001', ['001', '003', '004', '005', '006', '027', '028', '029', '030',
									 '020', '021', '022', '023', '024', '025',
									 '044', '045', '046', '047', '048', '049']) +
			 // B25044 Tenure by Vehicles Available, owner and renter with no vehicle
			 acsVariables('B25044', ['001', '003', '010'])],
	[name: 'tract', tiger: 'TRACT', file: 'tract', keys: ['state', 'county', 'tract'],
	 predicate: "for=tract:*&in=state:${acsState}&in=county:*",
	 variables:
			 acsVariables('B19013', ['001']) +   // median household income
			 acsVariables('B25077', ['001']) +   // median home value
			 acsVariables('B25064', ['001']) +   // median gross rent
			 acsVariables('B25003', ['001', '003']) +  // tenure, total and renter-occupied
			 // B08301 Means of Transportation to Work. These nine leaves are exclusive and sum to
			 // the total, so every commuter lands in exactly one; the intermediate car and transit
			 // subtotals are left out because they would double-count.
			 acsVariables('B08301', ['001', '003', '004', '010', '016', '017', '018', '019', '020', '021'])],
]

tasks.register('prepareAcs') {
	group = 'gis'
	description = "Clips TIGER geographies to the map bounds and fetches ACS ${acsYear} 5-year estimates into data/layers/acs-*.{geojson,csv}"
	doLast {
		def key = System.getenv('CENSUS_API_KEY')
		if (!key) {
			throw new GradleException('CENSUS_API_KEY is not set; request one at https://api.census.gov/data/key_signup.html')
		}
		acsGeographies.each { geography ->
			def zip = new File(dataDir, "raw/tiger/tl_${acsYear}_${acsState}_${geography.file}.zip")
			if (!zip.isFile()) {
				logger.lifecycle("prepareAcs: downloading ${zip.name}")
				zip.parentFile.mkdirs()
				URI.create("https://www2.census.gov/geo/tiger/TIGER${acsYear}/${geography.tiger}/${zip.name}")
						.toURL().withInputStream { source -> zip.withOutputStream { it << source } }
			}
			def geometry = new File(dataDir, "layers/acs-${geography.name}.geojson")
			geometry.delete()
			runCommand(['docker', 'run', '--rm',
					'-v', "${dataDir.absolutePath.replace(File.separatorChar, '/' as char)}:/data", gdalImage,
					'ogr2ogr', '-f', 'GeoJSON', "/data/layers/acs-${geography.name}.geojson",
					"/vsizip//data/raw/tiger/${zip.name}", '-clipsrc'] + mapBounds +
					// GEOID is the join key; the rest of the TIGER schema is land area and centroids
					['-select', 'GEOID', '-nlt', 'PROMOTE_TO_MULTI', '-t_srs', 'EPSG:4326',
					'-lco', 'RFC7946=YES', '-lco', 'COORDINATE_PRECISION=6'])

			def wanted = new groovy.json.JsonSlurper().parse(geometry).features
					.collect { it.properties.GEOID } as Set
			// The api caps a request at 50 variables, and asking for the state rather than a county
			// list keeps the counties the extent happens to touch out of the build, so widening
			// mapBounds cannot silently drop one.
			def estimates = [:].withDefault { [:] }
			geography.variables.collate(45).each { chunk ->
				def url = "https://api.census.gov/data/${acsYear}/acs/acs5?get=${chunk.join(',')}" +
						"&${geography.predicate}&key=${key}"
				def response
				try {
					response = new groovy.json.JsonSlurper().parseText(URI.create(url).toURL().getText('UTF-8'))
				}
				catch (IOException e) {
					// the url carries the api key, so it must never reach the build log
					throw new GradleException("ACS request failed: ${e.message.replace(key, '***')}")
				}
				def header = response.head()
				response.tail().each { row ->
					def geoid = geography.keys.collect { row[header.indexOf(it)] }.join('')
					if (wanted.contains(geoid)) {
						chunk.each { estimates[geoid][it] = row[header.indexOf(it)] }
					}
				}
			}
			if (estimates.size() != wanted.size()) {
				throw new GradleException("ACS covered ${estimates.size()} of the ${wanted.size()} ${geography.name} in the clip")
			}
			new File(dataDir, "layers/acs-${geography.name}.csv").withWriter('UTF-8') { writer ->
				writer.writeLine((['GEOID'] + geography.variables).join(','))
				estimates.keySet().sort().each { geoid ->
					writer.writeLine(([geoid] + geography.variables.collect { estimates[geoid][it] ?: '' }).join(','))
				}
			}
			logger.lifecycle("prepareAcs: wrote acs-${geography.name}.geojson and .csv " +
					"(${estimates.size()} features, ${geography.variables.size()} variables)")
		}
	}
}

tasks.register('resetSchema') {
	group = 'gis'
	description = 'Drops the app and gis schemas so the next bootRun re-migrates; keeps staging'
	doLast {
		startStack()
		psql('drop schema if exists gis cascade; drop schema if exists app cascade;')
		logger.lifecycle('resetSchema: dropped app and gis, kept staging')
	}
}

// The Vite dev server. It gets start/stop/status tasks rather than being left to `npm run dev`
// because stopping that by hand does not work: npm spawns a shell, which spawns npm-cli, which
// spawns node running vite, and only the leaf holds the port. Killing whatever listens on 5173
// orphans the wrappers above it, and the dying leaf keeps rolldown's native binding open long
// enough to make the next `npm ci` fail on a locked file.
//
// So start vite directly, skipping npm's wrappers, and stop it through ProcessHandle, which walks
// the descendants without a taskkill or a pkill.
def frontendDir = file('../frontend')
def frontendPort = 5173
def devServerDir = new File(frontendDir, '.dev-server')
def vitePidFile = new File(devServerDir, 'vite.pid')
def viteLogFile = new File(devServerDir, 'vite.log')

// Vite binds the name localhost, which on Windows resolves to ::1 alone, so probing 127.0.0.1
// reports a free port while the server is up. Ask every address the name resolves to.
def portListening = { int port ->
	InetAddress.getAllByName('localhost').any { address ->
		def socket = new Socket()
		try {
			socket.connect(new InetSocketAddress(address, port), 250)
			return true
		}
		catch (IOException ignored) {
			return false
		}
		finally {
			socket.close()
		}
	}
}

// Whoever holds the port. ProcessHandle cannot answer this: info().commandLine() is empty on
// Windows for any process the JVM did not start, so a vite process is not recognisable by its
// arguments, only by the port it answers on. That is what lets these tasks stop a server someone
// started by hand, not just the one frontendStart launched.
def portOwners = { int port ->
	def windows = System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('win')
	// netstat without -p, because -p tcp lists IPv4 alone and vite's listener is on ::1
	def command = windows
			? ['cmd', '/c', 'netstat -ano']
			: ['sh', '-c', "lsof -ti tcp:${port} -sTCP:LISTEN".toString()]
	def process = new ProcessBuilder(command as String[]).redirectErrorStream(true).start()
	def output = process.inputStream.getText('UTF-8')
	process.waitFor()
	if (!windows) {
		return output.readLines().findAll { it.trim() ==~ /\d+/ }.collect { it.trim() as long }.unique()
	}
	// TCP    [::1]:5173    [::]:0    LISTENING    47820
	output.readLines()
			.collect { it.trim().split(/\s+/) }
			.findAll { it.length >= 5 && it[0] == 'TCP' && it[1].endsWith(":${port}") && it[3] == 'LISTENING' }
			.collect { it[4] as long }
			.findAll { it > 0 }
			.unique()
}

// Whatever is serving a port: the pid we recorded if we started it, plus whoever holds the port if
// we did not. bootRun has the same problem as the dev server -- a backend left over from an
// earlier session takes 8080 and the next one dies on startup -- so this is shared rather than
// written twice.
def serverHandles = { int port, File pidFile ->
	def found = []
	def recorded = pidFile?.isFile() ? pidFile.text.trim() : ''
	if (recorded ==~ /\d+/) {
		ProcessHandle.of(recorded as long).ifPresent { found << it }
	}
	portOwners(port).each { pid ->
		if (found.every { it.pid() != pid }) {
			ProcessHandle.of(pid).ifPresent { found << it }
		}
	}
	found.findAll { it.isAlive() }
}

def terminate = { ProcessHandle handle ->
	def tree = [handle] + handle.descendants().toList()
	tree.reverseEach { it.destroy() }
	tree.each { member ->
		try {
			member.onExit().get(10, java.util.concurrent.TimeUnit.SECONDS)
		}
		catch (Exception ignored) {
			member.destroyForcibly()
		}
	}
}

def stopServer = { String label, int port, File pidFile, Closure log ->
	def handles = serverHandles(port, pidFile)
	pidFile?.delete()
	if (!handles) {
		log("${label}: nothing running")
		return
	}
	handles.each { handle ->
		terminate(handle)
		log("${label}: stopped pid ${handle.pid()}")
	}
	// the port outlives the process by a moment, and a start that races it binds nothing
	for (int i = 0; i < 40 && portListening(port); i++) {
		Thread.sleep(250)
	}
	if (portListening(port)) {
		throw new GradleException("port ${port} is still held after stopping every process on it")
	}
}

tasks.register('frontendStop') {
	group = 'frontend'
	description = 'Stops the Vite dev server, including one started outside these tasks'
	doLast {
		stopServer('frontendStop', frontendPort, vitePidFile) { logger.lifecycle(it) }
	}
}

tasks.register('frontendStart') {
	group = 'frontend'
	description = "Starts the Vite dev server on port ${frontendPort} in the background"
	doLast {
		if (portListening(frontendPort)) {
			logger.lifecycle("frontendStart: already serving http://localhost:${frontendPort}/")
			return
		}
		def vite = new File(frontendDir, 'node_modules/vite/bin/vite.js')
		if (!vite.isFile()) {
			throw new GradleException("no vite in ${frontendDir}/node_modules; run `npm ci` there first")
		}
		devServerDir.mkdirs()
		viteLogFile.delete()
		// node directly rather than `npm run dev`, so the process we record is the one that serves
		// the port and there is no wrapper tree to lose track of
		def process = new ProcessBuilder(['node', vite.absolutePath, '--port', frontendPort as String] as String[])
				.directory(frontendDir).redirectErrorStream(true).redirectOutput(viteLogFile).start()
		vitePidFile.text = process.pid() as String
		for (int i = 0; i < 120 && process.isAlive() && !portListening(frontendPort); i++) {
			Thread.sleep(250)
		}
		if (!process.isAlive() || !portListening(frontendPort)) {
			throw new GradleException("vite did not come up on ${frontendPort}:\n${viteLogFile.text}")
		}
		logger.lifecycle("frontendStart: pid ${process.pid()} serving http://localhost:${frontendPort}/ (log: ${viteLogFile})")
	}
}

tasks.register('frontendStatus') {
	group = 'frontend'
	description = 'Reports whether the Vite dev server is running'
	doLast {
		def handles = serverHandles(frontendPort, vitePidFile)
		def port = portListening(frontendPort) ? 'listening' : 'free'
		logger.lifecycle(handles
				? "frontendStatus: running, pid ${handles*.pid().join(', ')}, port ${frontendPort} ${port}"
				: "frontendStatus: not running, port ${frontendPort} ${port}")
	}
}

def backendPort = 8080

tasks.register('backendStop') {
	group = 'application'
	description = "Stops whatever is serving port ${backendPort}, so the next bootRun can bind it"
	doLast {
		stopServer('backendStop', backendPort, null) { logger.lifecycle(it) }
	}
}

tasks.register('backendStatus') {
	group = 'application'
	description = 'Reports whether a backend is serving port 8080'
	doLast {
		def handles = serverHandles(backendPort, null)
		logger.lifecycle(handles
				? "backendStatus: running, pid ${handles*.pid().join(', ')}, port ${backendPort} listening"
				: "backendStatus: not running, port ${backendPort} ${portListening(backendPort) ? 'held by something else' : 'free'}")
	}
}
tasks.named('bootRun') {
	dependsOn 'ingestData'
}
