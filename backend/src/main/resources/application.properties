spring.application.name=backend
spring.docker.compose.file=../compose.yaml
# start-only: the default stops the containers when the backend exits
spring.docker.compose.lifecycle-management=start-only
spring.flyway.schemas=app,gis
management.endpoint.health.show-details=always
sandysprings.geoserver.url=http://localhost:8081/geoserver
sandysprings.geoserver.username=admin
sandysprings.geoserver.password=geoserver
sandysprings.geoserver.publish=true

# USGS NAIP aerial imagery, proxied and cached tile by tile; see AerialTileController.
# The cache lives under data/raw because it is derived, large and refetchable, which is exactly
# what that directory is gitignored for.
sandysprings.aerial.url=https://imagery.nationalmap.gov/arcgis/rest/services/USGSNAIPImagery/ImageServer
sandysprings.aerial.cache=../data/raw/aerial-cache
