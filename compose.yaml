services:
  postgis:
    image: postgis/postgis:18-3.6
    labels:
      org.springframework.boot.service-connection: postgres
    environment:
      POSTGRES_DB: sandysprings
      POSTGRES_USER: app
      # app is the superuser: Boot takes the datasource credentials from these container vars
      POSTGRES_PASSWORD: app
    ports:
      # loopback only, so the literal dev credentials above are not reachable off this machine
      - "127.0.0.1:5432:5432"
    volumes:
      # one file, not the directory: mounting the directory hides the image's own postgis init script
      - ./db/init/01-roles.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
      - postgis-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U app -d sandysprings"]
      interval: 5s
      timeout: 5s
      retries: 12

  geoserver:
    image: docker.osgeo.org/geoserver:3.0.1
    environment:
      SKIP_DEMO_DATA: "true"
      GEOSERVER_ADMIN_USER: admin
      GEOSERVER_ADMIN_PASSWORD: geoserver
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - geoserver-data:/opt/geoserver_data
    depends_on:
      postgis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/geoserver/rest/about/version -u admin:geoserver -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  postgis-data:
  geoserver-data:
